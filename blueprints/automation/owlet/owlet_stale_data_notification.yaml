# Adapted from LucasVollebergh/owlet (Apache-2.0).
blueprint:
  name: Owlet readings stale notification
  description: >-
    Send a notification when an Owlet sock's readings stop updating (its
    Readings stale sensor turns on), and optionally when they come back.
  domain: automation
  source_url: https://github.com/itsjustlabs/owlet/blob/main/blueprints/automation/owlet/owlet_stale_data_notification.yaml
  homeassistant:
    min_version: "2025.2.0"
  input:
    stale_sensor:
      name: Readings stale sensor
      description: The sock's Readings stale binary sensor.
      selector:
        entity:
          filter:
            - integration: owlet
              domain: binary_sensor
              device_class: problem
    delay:
      name: Extra delay
      description: Only notify if the readings stay stale this much longer.
      default: 0
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: minutes
    notify_device:
      name: Phone
      description: Phone with the Home Assistant Companion app that gets the notification.
      selector:
        device:
          filter:
            - integration: mobile_app
    notify_recovered:
      name: Notify when readings are back
      default: true
      selector:
        boolean:

triggers:
  - trigger: state
    entity_id: !input stale_sensor
    from: "off"
    to: "on"
    for:
      minutes: !input delay
    id: stale
  - trigger: state
    entity_id: !input stale_sensor
    from: "on"
    to: "off"
    id: recovered

variables:
  notify_recovered: !input notify_recovered

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: stale
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: Owlet readings stopped
            message: >-
              Home Assistant hasn't had a new Owlet reading for a while. Check
              the base station and the Owlet app.
      - conditions:
          - condition: trigger
            id: recovered
          - condition: template
            value_template: "{{ notify_recovered }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: Owlet readings are back
            message: Home Assistant is getting live Owlet readings again.

mode: single
