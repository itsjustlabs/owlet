# Owlet Smart Sock dashboard for Home Assistant.
# Adapted from LucasVollebergh/owlet (Apache-2.0).
#
# Uses built-in cards only, no custom cards needed. Made for the Smart Sock 3;
# a Smart Sock 2 doesn't report skin temperature, sleep state, sleep sessions or the 10 minute
# oxygen average, so those cards show "Entity not available".
#
# Install (details in the README):
#   1. Settings > Dashboards > Add dashboard > New dashboard from scratch.
#   2. Open it, pencil > three dots > Raw configuration editor.
#   3. Paste this file after replacing every "owlet_sock_serial_number" with your sock's
#      entity ID prefix (for example "owlet_sock_ab12cd34").
#
# This is not a medical device. Readings are polled from the Owlet cloud and
# can be late or stop without warning. Keep the Owlet base station and app as
# your alarm.
title: Owlet
views:
  # Laid out like the Owlet app's home screen. Live readings only show while
  # the sock is monitoring, so nothing shows "unavailable" between sessions.
  - title: Tonight
    path: tonight
    icon: mdi:weather-night
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            text_only: true
            content: |
              {# Change the name to your baby's. #}
              {% set name = 'Baby' %}
              {% set sleep = states('sensor.owlet_sock_serial_number_sleep_state') %}
              {% set started = as_datetime(states('sensor.owlet_sock_serial_number_session_started'), none) %}
              {% if is_state('sensor.owlet_sock_serial_number_monitoring_state', 'monitoring') %}
              ## {{ name }} is {{ {'awake': 'awake', 'light_sleep': 'in light sleep',
              'deep_sleep': 'in deep sleep'}.get(sleep, 'being monitored') }}
              {% else %}
              ## {{ state_translated('sensor.owlet_sock_serial_number_monitoring_state') }}
              {% endif %}
              {% if is_state('binary_sensor.owlet_sock_serial_number_sleep_session', 'on') and started %}
              {% set m = ((now() - started).total_seconds() // 60) | int %}
              Monitoring: {{ m // 60 ~ 'h ' if m >= 60 else '' }}{{ m % 60 }}m
              {% elif is_state('binary_sensor.owlet_sock_serial_number_charging', 'on') %}
              Sock battery {{ states('sensor.owlet_sock_serial_number_battery_percentage') | int(0) }}%
              {% endif %}
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Live health readings
            icon: mdi:heart-pulse
          - type: markdown
            text_only: true
            content: |
              {% set alerts = [
                'binary_sensor.owlet_sock_serial_number_critical_oxygen_alert',
                'binary_sensor.owlet_sock_serial_number_low_oxygen_alert',
                'binary_sensor.owlet_sock_serial_number_high_oxygen_alert',
                'binary_sensor.owlet_sock_serial_number_high_heart_rate_alert',
                'binary_sensor.owlet_sock_serial_number_low_heart_rate_alert',
                'binary_sensor.owlet_sock_serial_number_discomfort_alert',
                'binary_sensor.owlet_sock_serial_number_sock_disconnected_alert',
                'binary_sensor.owlet_sock_serial_number_lost_power_alert',
                'binary_sensor.owlet_sock_serial_number_low_battery_alert',
                'binary_sensor.owlet_sock_serial_number_critical_battery_alert',
              ] | select('is_state', 'on') | map('state_attr', 'friendly_name') | list %}
              {{ 'Owlet alert: ' ~ alerts | join(', ') if alerts else 'No Owlet alerts are on.' }}
            visibility:
              - condition: state
                entity: sensor.owlet_sock_serial_number_monitoring_state
                state: monitoring
          - type: tile
            entity: sensor.owlet_sock_serial_number_heart_rate
            name: Pulse rate
            visibility:
              - condition: state
                entity: sensor.owlet_sock_serial_number_monitoring_state
                state: monitoring
          - type: tile
            entity: sensor.owlet_sock_serial_number_o2_saturation
            name: Oxygen
            visibility:
              - condition: state
                entity: sensor.owlet_sock_serial_number_monitoring_state
                state: monitoring
          - type: tile
            entity: sensor.owlet_sock_serial_number_sleep_state
            name: Sleep
            visibility:
              - condition: state
                entity: sensor.owlet_sock_serial_number_monitoring_state
                state: monitoring
          - type: tile
            entity: sensor.owlet_sock_serial_number_skin_temperature
            name: Skin temperature
            visibility:
              - condition: state
                entity: sensor.owlet_sock_serial_number_monitoring_state
                state: monitoring
          - type: markdown
            text_only: true
            content: |
              Not monitoring right now:
              {{ state_translated('sensor.owlet_sock_serial_number_monitoring_state') | lower }}.
            visibility:
              - condition: state
                entity: sensor.owlet_sock_serial_number_monitoring_state
                state_not: monitoring

      - type: grid
        cards:
          - type: heading
            heading: Sleep summary
            icon: mdi:sleep
          - type: markdown
            content: |
              {% macro hm(minutes) %}{% set m = minutes | int(0) %}{{ m // 60 ~ 'h ' if m >= 60 else '' }}{{ m % 60 }}m{% endmacro %}
              {% set started = as_datetime(states('sensor.owlet_sock_serial_number_session_started'), none) %}
              {% set ended = as_datetime(states('sensor.owlet_sock_serial_number_session_ended'), none) %}
              {% if started %}
              **{{ 'Session in progress' if is_state('binary_sensor.owlet_sock_serial_number_sleep_session', 'on') else 'Last session' }}**,
              {{ as_local(started).strftime('%H:%M') }} – {{ as_local(ended).strftime('%H:%M') if ended else 'now' }}

              | Time asleep | Wakings |
              | :-- | :-- |
              | **{{ hm(states('sensor.owlet_sock_serial_number_time_asleep')) }}** | **{{ states('sensor.owlet_sock_serial_number_wakings') }}** |

              | Awake | Light | Deep |
              | :-- | :-- | :-- |
              | {{ hm(states('sensor.owlet_sock_serial_number_time_awake')) }} | {{ hm(states('sensor.owlet_sock_serial_number_light_sleep_time')) }} | {{ hm(states('sensor.owlet_sock_serial_number_deep_sleep_time')) }} |
              {% else %}
              No sleep session yet. One starts when the sock begins reporting
              sleep.
              {% endif %}
          - type: history-graph
            title: Sleep cycle
            hours_to_show: 12
            entities:
              - entity: sensor.owlet_sock_serial_number_sleep_state
                name: Sleep state
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Dream Sock
            icon: mdi:sock
          - type: tile
            entity: switch.owlet_sock_serial_number_base_station_on
            name: Base station
          - type: tile
            entity: sensor.owlet_sock_serial_number_monitoring_state
            name: Status
          - type: tile
            entity: sensor.owlet_sock_serial_number_battery_remaining
            name: Sock battery
          - type: tile
            entity: sensor.owlet_sock_serial_number_signal_strength
            name: Signal

  - title: Details
    path: owlet
    icon: mdi:baby-face-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
            icon: mdi:heart-pulse
          - type: markdown
            content: >-
              {% set last = as_datetime(states('sensor.owlet_sock_serial_number_last_updated'), none) %}
              **Readings are stale.** No new reading since
              {{ as_local(last).strftime('%H:%M') if last else 'unknown' }}.
              Check the base station and the Owlet app.
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_readings_stale
                state: "on"
          - type: tile
            entity: sensor.owlet_sock_serial_number_monitoring_state
            name: Monitoring
            grid_options:
              columns: full
          - type: gauge
            entity: sensor.owlet_sock_serial_number_heart_rate
            name: Heart rate
            min: 40
            max: 220
            needle: true
            visibility:
              - condition: state
                entity: sensor.owlet_sock_serial_number_heart_rate
                state_not: unavailable
          - type: gauge
            entity: sensor.owlet_sock_serial_number_o2_saturation
            name: O2 saturation
            min: 70
            max: 100
            needle: true
            visibility:
              - condition: state
                entity: sensor.owlet_sock_serial_number_o2_saturation
                state_not: unavailable
          - type: tile
            entity: sensor.owlet_sock_serial_number_o2_saturation_10_minute_average
            name: O2 10 min average
          - type: tile
            entity: sensor.owlet_sock_serial_number_skin_temperature
            name: Skin temperature
          - type: tile
            entity: sensor.owlet_sock_serial_number_sleep_state
            name: Sleep state
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_sock_off
            name: Sock off
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_charging
            name: Charging
          - type: tile
            entity: switch.owlet_sock_serial_number_base_station_on
            name: Base station

      - type: grid
        cards:
          - type: heading
            heading: Owlet alerts
            icon: mdi:alert
          - type: markdown
            content: No Owlet alerts are on.
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_critical_oxygen_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_low_oxygen_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_high_oxygen_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_high_heart_rate_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_low_heart_rate_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_discomfort_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_sock_disconnected_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_lost_power_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_low_battery_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_critical_battery_alert
                state_not: "on"
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_low_signal
                state_not: "on"
          # Each alert only shows while Owlet reports it.
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_critical_oxygen_alert
            name: Critical oxygen
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_critical_oxygen_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_low_oxygen_alert
            name: Low oxygen
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_low_oxygen_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_high_oxygen_alert
            name: High oxygen
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_high_oxygen_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_high_heart_rate_alert
            name: High heart rate
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_high_heart_rate_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_low_heart_rate_alert
            name: Low heart rate
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_low_heart_rate_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_discomfort_alert
            name: Discomfort
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_discomfort_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_sock_disconnected_alert
            name: Sock disconnected
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_sock_disconnected_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_lost_power_alert
            name: Base station lost power
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_lost_power_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_low_battery_alert
            name: Low battery
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_low_battery_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_critical_battery_alert
            name: Critical battery
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_critical_battery_alert
                state: "on"
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_low_signal
            name: Low signal
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_low_signal
                state: "on"

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Last 12 hours
            icon: mdi:chart-line
          # One unit per graph, so heart rate and O2 never share two axes.
          - type: history-graph
            title: Heart rate
            hours_to_show: 12
            entities:
              - entity: sensor.owlet_sock_serial_number_heart_rate
                name: Heart rate
            grid_options:
              columns: full
          - type: history-graph
            title: O2 saturation
            hours_to_show: 12
            entities:
              - entity: sensor.owlet_sock_serial_number_o2_saturation
                name: O2 saturation
              - entity: sensor.owlet_sock_serial_number_o2_saturation_10_minute_average
                name: 10 min average
            grid_options:
              columns: full
          - type: history-graph
            title: Sleep
            hours_to_show: 12
            entities:
              - entity: sensor.owlet_sock_serial_number_sleep_state
                name: Sleep state
              - entity: binary_sensor.owlet_sock_serial_number_sock_off
                name: Sock off
              - entity: binary_sensor.owlet_sock_serial_number_readings_stale
                name: Readings stale
            grid_options:
              columns: full

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Trends
            icon: mdi:chart-timeline-variant
          # Long-term statistics, which Home Assistant keeps after the recorder purge.
          - type: statistics-graph
            title: Heart rate per day
            period: day
            days_to_show: 30
            chart_type: line
            stat_types: [min, mean, max]
            entities:
              - entity: sensor.owlet_sock_serial_number_heart_rate
                name: Heart rate
            grid_options:
              columns: full
          - type: statistics-graph
            title: O2 saturation per day
            period: day
            days_to_show: 30
            chart_type: line
            stat_types: [min, mean, max]
            entities:
              - entity: sensor.owlet_sock_serial_number_o2_saturation
                name: O2 saturation
            grid_options:
              columns: full
          - type: statistics-graph
            title: Skin temperature per day
            period: day
            days_to_show: 30
            chart_type: line
            stat_types: [min, mean, max]
            entities:
              - entity: sensor.owlet_sock_serial_number_skin_temperature
                name: Skin temperature
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Device
            icon: mdi:battery-heart-variant
          - type: tile
            entity: sensor.owlet_sock_serial_number_battery_percentage
            name: Battery
          - type: tile
            entity: sensor.owlet_sock_serial_number_battery_remaining
            name: Battery remaining
          - type: tile
            entity: sensor.owlet_sock_serial_number_signal_strength
            name: Signal
          - type: tile
            entity: sensor.owlet_sock_serial_number_last_updated
            name: Last reading
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_readings_stale
            name: Readings stale
          - type: history-graph
            title: Battery
            hours_to_show: 48
            entities:
              - entity: sensor.owlet_sock_serial_number_battery_percentage
                name: Battery
            grid_options:
              columns: full
          - type: markdown
            content: >-
              This is not a medical device. Readings are polled from the Owlet
              cloud and can be late or stop without warning. Keep the Owlet
              base station and app as your alarm.
